[project]
name = "market_anomaly_detection"
version = "0.1.0"
description = "Real-time detection of price inconsistencies and abnormal volumes on betting and financial markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_anomaly_detection"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
